server:
  port: 8080

spring:
  application:
    name: tigerflow-server

  datasource:
    url: jdbc:mysql://localhost:3306/tigerflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  jwt:
    # 生产环境请使用更复杂的密钥
    secret: tigerflow-secret-key-must-be-at-least-256-bits-long-for-hs256
    access-token-validity: 3600
    refresh-token-validity: 604800
  cors:
    allowed-origins: "*"

logging:
  level:
    com.tigerflow: debug
    org.springframework.security: debug
