server:
  port: 8080

spring:
  application:
    name: tigerflow-server

  # 使用 H2 内存数据库测试
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 添加 H2 控制台（可选，访问 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 暂时禁用 Redis（可选）
  #  data:
  #    redis:
  #      host: localhost
  #      port: 6379

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: tigerflow-secret-key-must-be-at-least-256-bits-long-for-hs256
    access-token-validity: 3600
    refresh-token-validity: 604800
  cors:
    allowed-origins: "*"

logging:
  level:
    com.tigerflow: debug
    org.springframework.security: debug
