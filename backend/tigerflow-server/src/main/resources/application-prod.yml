# 生产环境配置 - 阿里云 PolarDB
server:
  port: 9998

spring:
  application:
    name: tigerflow-server

  # 阿里云 PolarDB 数据库配置（兼容 MySQL 5.7）
  datasource:
    # PolarDB 连接地址（从阿里云控制台获取）
    url: jdbc:mysql://pc-uf62hbquapjd63r02.rwlb.rds.aliyuncs.com:3306/tigerflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: leshare
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 连接池优化
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000

  # 禁用 H2 控制台
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  jwt:
    # 生产环境请使用更复杂的密钥（通过环境变量注入）
    secret: ${JWT_SECRET}
    access-token-validity: 3600
    refresh-token-validity: 604800
  cors:
    # 生产环境请指定具体的域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.tigerflow: info
    org.springframework.security: warn
  file:
    name: logs/tigerflow.log
    max-size: 10MB
    max-history: 30

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
